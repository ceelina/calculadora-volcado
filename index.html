<script>
/* =========================================================
   EL PARUCO - CONTROL DE VOLCADO
   SCRIPT CORREGIDO
========================================================= */

const rep = {
  cadencia: '',
  rNeto: '0.0',
  rBruto: '0.0',
  faltan: 0,
  rendimiento: '',
  descarte: '',
  totalCajas: 0,
  totalKg: 0,
  detalleEmpaque: '',
  cera: '0.00',
  jabon: '0.00'
};


/* =========================================================
   FUNCIONES BÁSICAS
========================================================= */

function obtenerNumero(id, defecto = 0) {
  const elemento = document.getElementById(id);

  if (!elemento) return defecto;

  const valor = parseFloat(elemento.value);

  return Number.isFinite(valor) ? valor : defecto;
}


/*
   Convierte una hora HH:MM en minutos.

   Ejemplo:
   06:00 -> 360
   10:50 -> 650
*/
function horaAMinutos(valor) {

  if (!valor) {
    return null;
  }

  // Normalizamos posibles espacios
  valor = String(valor).trim();

  // Buscamos HH:MM
  const coincidencia = valor.match(/(\d{1,2}):(\d{2})/);

  if (!coincidencia) {
    return null;
  }

  const horas = parseInt(coincidencia[1], 10);
  const minutos = parseInt(coincidencia[2], 10);

  if (
    !Number.isFinite(horas) ||
    !Number.isFinite(minutos)
  ) {
    return null;
  }

  if (
    horas < 0 ||
    horas > 23 ||
    minutos < 0 ||
    minutos > 59
  ) {
    return null;
  }

  return horas * 60 + minutos;
}


/*
   Convierte minutos nuevamente a HH:MM
*/
function minutosAHora(totalMinutos) {

  totalMinutos =
    ((Math.round(totalMinutos) % 1440) + 1440) % 1440;

  const horas =
    Math.floor(totalMinutos / 60);

  const minutos =
    totalMinutos % 60;

  return (
    String(horas).padStart(2, '0') +
    ':' +
    String(minutos).padStart(2, '0')
  );
}


/* =========================================================
   HORA ACTUAL
========================================================= */

function obtenerHoraActual() {

  const ahora = new Date();

  return (
    String(ahora.getHours()).padStart(2, '0') +
    ':' +
    String(ahora.getMinutes()).padStart(2, '0')
  );
}


function actualizarHoraFinal() {

  document.getElementById('horaFin').value =
    obtenerHoraActual();

  calcular();
}


/* =========================================================
   CADENCIA
========================================================= */

function calcularCadencia() {

  const objetivo =
    obtenerNumero('ritmoObjetivo', 0);

  if (objetivo <= 0) {

    document.getElementById(
      'cadenciaObjetivo'
    ).textContent = '--';

    rep.cadencia = '';

    return;
  }


  const segundos =
    Math.round(3600 / objetivo);

  const minutos =
    Math.floor(segundos / 60);

  const segundosRestantes =
    segundos % 60;


  const texto =
    `1 bin cada ${minutos}m ${String(segundosRestantes).padStart(2, '0')}s`;


  document.getElementById(
    'cadenciaObjetivo'
  ).textContent = texto;


  rep.cadencia = texto;
}


/* =========================================================
   RITMO DE VOLCADO
========================================================= */

function calcularRitmo() {

  const bines =
    obtenerNumero('bines', 0);

  const totalLote =
    obtenerNumero('totalLote', 0);

  const pausas =
    Math.max(
      0,
      obtenerNumero('pausas', 0)
    );


  const horaInicioElemento =
    document.getElementById('horaInicio');

  const horaFinElemento =
    document.getElementById('horaFin');


  const horaInicio =
    horaInicioElemento.value;

  const horaFin =
    horaFinElemento.value;


  /*
     IMPORTANTE:
     Leemos directamente .value de los type="time".
  */

  const inicio =
    horaAMinutos(horaInicio);

  const finOriginal =
    horaAMinutos(horaFin);


  /*
     Si falta alguna hora, no podemos calcular.
  */

  if (
    inicio === null ||
    finOriginal === null ||
    bines <= 0
  ) {

    document.getElementById(
      'ritmoNeto'
    ).innerHTML =
      `0.0 <span class="res-unit">bin/h</span>`;


    document.getElementById(
      'ritmoBruto'
    ).innerHTML =
      `0.0 <span class="res-unit">bin/h</span>`;


    document.getElementById(
      'finEstimado'
    ).textContent = '--:--';


    document.getElementById(
      'proyeccionBines'
    ).innerHTML =
      `-- <span class="res-unit">totales</span>`;


    rep.rNeto = '0.0';
    rep.rBruto = '0.0';
    rep.faltan = totalLote > 0
      ? Math.max(0, totalLote - bines)
      : 0;

    return {
      ritmoNeto: 0,
      ritmoBruto: 0,
      bines,
      totalLote,
      inicio,
      fin: null
    };
  }


  /*
     Si la hora final es menor que la inicial,
     significa que cruzó medianoche.
  */

  let fin = finOriginal;

  if (fin < inicio) {
    fin += 1440;
  }


  /*
     Tiempo total transcurrido.
  */

  const minutosBrutos =
    fin - inicio;


  /*
     Tiempo efectivo descontando pausas.
  */

  const minutosNetos =
    minutosBrutos - pausas;


  if (
    minutosBrutos <= 0 ||
    minutosNetos <= 0
  ) {

    document.getElementById(
      'ritmoNeto'
    ).innerHTML =
      `0.0 <span class="res-unit">bin/h</span>`;


    document.getElementById(
      'ritmoBruto'
    ).innerHTML =
      `0.0 <span class="res-unit">bin/h</span>`;


    return {
      ritmoNeto: 0,
      ritmoBruto: 0,
      bines,
      totalLote,
      inicio,
      fin
    };
  }


  /*
     ======================================================
     ACÁ ESTÁ EL CÁLCULO
     ======================================================

     Ejemplo:

     30 bines
     290 minutos

     30 / (290 / 60)
     = 6.2068

     Resultado = 6.2 bin/h
  */

  const ritmoBruto =
    bines / (minutosBrutos / 60);


  const ritmoNeto =
    bines / (minutosNetos / 60);


  /*
     Mostrar resultados
  */

  document.getElementById(
    'ritmoNeto'
  ).innerHTML =
    `${ritmoNeto.toFixed(1)}
     <span class="res-unit">bin/h</span>`;


  document.getElementById(
    'ritmoBruto'
  ).innerHTML =
    `${ritmoBruto.toFixed(1)}
     <span class="res-unit">bin/h</span>`;


  rep.rNeto =
    ritmoNeto.toFixed(1);

  rep.rBruto =
    ritmoBruto.toFixed(1);


  /*
     ======================================================
     FIN DEL LOTE
  */

  const faltan =
    Math.max(
      0,
      totalLote - bines
    );


  rep.faltan = faltan;


  if (
    totalLote > 0 &&
    bines >= totalLote
  ) {

    document.getElementById(
      'tituloFinEstimado'
    ).textContent =
      'Lote completado';


    document.getElementById(
      'finEstimado'
    ).textContent =
      '¡Terminado!';

  } else if (
    faltan > 0 &&
    ritmoNeto > 0
  ) {

    const minutosFaltantes =
      Math.ceil(
        (faltan / ritmoNeto) * 60
      );


    const horaTerminacion =
      fin + minutosFaltantes;


    document.getElementById(
      'tituloFinEstimado'
    ).textContent =
      `Fin lote (faltan ${faltan} b)`;


    document.getElementById(
      'finEstimado'
    ).textContent =
      `${minutosAHora(horaTerminacion)} hs`;

  } else {

    document.getElementById(
      'tituloFinEstimado'
    ).textContent =
      'Fin lote';


    document.getElementById(
      'finEstimado'
    ).textContent =
      '--:--';
  }


  /*
     ======================================================
     PROYECCIÓN AL CIERRE DEL TURNO
  */

  const horaCierre =
    document.getElementById(
      'horaCierreTurno'
    ).value;


  const cierreOriginal =
    horaAMinutos(horaCierre);


  if (
    cierreOriginal !== null &&
    ritmoNeto > 0
  ) {

    let cierre =
      cierreOriginal;


    if (cierre < fin) {
      cierre += 1440;
    }


    const minutosDisponibles =
      cierre - fin;


    if (minutosDisponibles > 0) {

      const binesExtra =
        (minutosDisponibles / 60) *
        ritmoNeto;


      let proyectados =
        bines + binesExtra;


      /*
         No proyectamos más bines que
         el total del lote.
      */

      if (totalLote > 0) {

        proyectados =
          Math.min(
            proyectados,
            totalLote
          );
      }


      document.getElementById(
        'proyeccionBines'
      ).innerHTML =
        `~${Math.round(proyectados)}
         <span class="res-unit">totales</span>`;

    } else {

      document.getElementById(
        'proyeccionBines'
      ).innerHTML =
        `${Math.round(bines)}
         <span class="res-unit">totales</span>`;
    }

  } else {

    document.getElementById(
      'proyeccionBines'
    ).innerHTML =
      `-- <span class="res-unit">totales</span>`;
  }


  return {
    ritmoNeto,
    ritmoBruto,
    bines,
    totalLote,
    inicio,
    fin
  };
}


/* =========================================================
   EMPAQUE
========================================================= */

function calcularEmpaque(datos) {

  let cajasBrutas = 0;
  let kgBrutos = 0;

  const detalle = [];


  document
    .querySelectorAll(
      '#empaqueContainer .empaque-row'
    )
    .forEach(fila => {

      const cantidad =
        parseFloat(
          fila.querySelector('.e-cant').value
        ) || 0;


      const cajasPorUnidad =
        parseFloat(
          fila.querySelector('.e-cajas').value
        ) || 0;


      const kgCaja =
        parseFloat(
          fila.querySelector('.e-kg').value
        ) || 0;


      if (
        cantidad > 0 &&
        cajasPorUnidad > 0
      ) {

        const cajas =
          cantidad * cajasPorUnidad;


        cajasBrutas += cajas;


        kgBrutos +=
          cajas * kgCaja;


        detalle.push(
          `${cantidad}x${cajasPorUnidad} cj (${kgCaja}kg)`
        );
      }

    });


  const cajasIniciales =
    Math.max(
      0,
      obtenerNumero('cajasIniciales', 0)
    );


  const kgCajaInicial =
    Math.max(
      0,
      obtenerNumero('kgCajaInicial', 15)
    );


  const totalCajas =
    Math.max(
      0,
      cajasBrutas - cajasIniciales
    );


  const totalKg =
    Math.max(
      0,
      kgBrutos -
      cajasIniciales * kgCajaInicial
    );


  document.getElementById(
    'totalCajasDisplay'
  ).innerHTML =
    `${totalCajas}
     <span class="res-unit">cajas</span>`;


  document.getElementById(
    'totalKgEmpacados'
  ).innerHTML =
    `${totalKg.toFixed(1)}
     <span class="res-unit">kg</span>`;


  /*
     Bines que todavía estarían en tránsito
     entre volcado y empaque.
  */

  const desfasaje =
    Math.max(
      0,
      obtenerNumero('desfasajeMin', 0)
    );


  let binesEnTransito = 0;


  if (
    datos.ritmoNeto > 0 &&
    desfasaje > 0
  ) {

    binesEnTransito =
      datos.ritmoNeto *
      (desfasaje / 60);
  }


  const binesEmpacables =
    Math.max(
      0,
      datos.bines - binesEnTransito
    );


  const pesoBin =
    obtenerNumero('pesoBin', 330);


  const kgVolcados =
    binesEmpacables * pesoBin;


  if (
    kgVolcados > 0 &&
    totalKg > 0
  ) {

    const rendimiento =
      (totalKg / kgVolcados) * 100;


    const descarte =
      Math.max(
        0,
        100 - rendimiento
      );


    document.getElementById(
      'rendimientoPorc'
    ).innerHTML =
      `${rendimiento.toFixed(1)}
       <span class="res-unit">%</span>`;


    document.getElementById(
      'descartePorc'
    ).innerHTML =
      `${descarte.toFixed(1)}
       <span class="res-unit">%</span>`;


    document.getElementById(
      'subtextBinesAjustados'
    ).textContent =
      `Base: ${binesEmpacables.toFixed(1)} bines empacables`;


    rep.rendimiento =
      `${rendimiento.toFixed(1)}%`;

    rep.descarte =
      `${descarte.toFixed(1)}%`;

  } else {

    document.getElementById(
      'rendimientoPorc'
    ).innerHTML =
      `0.0 <span class="res-unit">%</span>`;


    document.getElementById(
      'descartePorc'
    ).innerHTML =
      `0.0 <span class="res-unit">%</span>`;


    document.getElementById(
      'subtextBinesAjustados'
    ).textContent =
      'Sobre bines en empaque';


    rep.rendimiento = '';
    rep.descarte = '';
  }


  rep.totalCajas =
    totalCajas;

  rep.totalKg =
    Math.round(totalKg);

  rep.detalleEmpaque =
    detalle.join(' + ');
}


/* =========================================================
   QUÍMICOS
========================================================= */

function calcularQuimicos(datos) {

  const ceraIni =
    parseFloat(
      document.getElementById('ceraIni').value
    );


  const ceraFin =
    parseFloat(
      document.getElementById('ceraFin').value
    );


  const jabonIni =
    parseFloat(
      document.getElementById('jabonIni').value
    );


  const jabonFin =
    parseFloat(
      document.getElementById('jabonFin').value
    );


  const pesoBin =
    obtenerNumero('pesoBin', 330);


  const toneladas =
    (datos.bines * pesoBin) / 1000;


  if (toneladas <= 0) {

    document.getElementById(
      'ceraTon'
    ).innerHTML =
      `0.00 <span class="res-unit">L/t</span>`;


    document.getElementById(
      'jabonTon'
    ).innerHTML =
      `0.00 <span class="res-unit">L/t</span>`;


    return;
  }


  if (
    Number.isFinite(ceraIni) &&
    Number.isFinite(ceraFin) &&
    ceraIni >= ceraFin
  ) {

    const consumo =
      (ceraIni - ceraFin) /
      toneladas;


    rep.cera =
      consumo.toFixed(2);


    document.getElementById(
      'ceraTon'
    ).innerHTML =
      `${rep.cera}
       <span class="res-unit">L/t</span>`;

  } else {

    rep.cera = '0.00';

    document.getElementById(
      'ceraTon'
    ).innerHTML =
      `0.00 <span class="res-unit">L/t</span>`;
  }


  if (
    Number.isFinite(jabonIni) &&
    Number.isFinite(jabonFin) &&
    jabonIni >= jabonFin
  ) {

    const consumo =
      (jabonIni - jabonFin) /
      toneladas;


    rep.jabon =
      consumo.toFixed(2);


    document.getElementById(
      'jabonTon'
    ).innerHTML =
      `${rep.jabon}
       <span class="res-unit">L/t</span>`;

  } else {

    rep.jabon = '0.00';

    document.getElementById(
      'jabonTon'
    ).innerHTML =
      `0.00 <span class="res-unit">L/t</span>`;
  }
}


/* =========================================================
   CÁLCULO GENERAL
========================================================= */

function calcular() {

  calcularCadencia();


  const datos =
    calcularRitmo();


  calcularEmpaque(datos);


  calcularQuimicos(datos);
}


/* =========================================================
   EVENTOS
========================================================= */

/*
   Usamos "input" Y "change".

   Esto es importante en Android porque algunos
   selectores de hora disparan solamente "change".
*/

document
  .querySelectorAll('input')
  .forEach(input => {

    input.addEventListener(
      'input',
      calcular
    );

    input.addEventListener(
      'change',
      calcular
    );

  });


/*
   Actualizar hora final
*/

document
  .getElementById('btnUpdate')
  .addEventListener(
    'click',
    actualizarHoraFinal
  );


/* =========================================================
   AGREGAR RENGLÓN DE EMPAQUE
========================================================= */

document
  .getElementById('btnAddEmpaque')
  .addEventListener(
    'click',
    () => {

      const fila =
        document.createElement('div');

      fila.className =
        'empaque-row';


      fila.innerHTML = `
        <input
          type="number"
          class="e-cant"
          placeholder="Ej: 10"
          min="0"
          step="1"
          inputmode="numeric"
        >

        <input
          type="number"
          class="e-cajas"
          placeholder="Ej: 88"
          min="0"
          step="1"
          inputmode="numeric"
        >

        <input
          type="number"
          class="e-kg"
          placeholder="Ej: 15.0"
          min="0"
          step="0.1"
        >

        <button
          type="button"
          class="btn-del-row"
        >
          ×
        </button>
      `;


      document
        .getElementById('empaqueContainer')
        .appendChild(fila);


      fila
        .querySelectorAll('input')
        .forEach(input => {

          input.addEventListener(
            'input',
            calcular
          );

          input.addEventListener(
            'change',
            calcular
          );

        });


      calcular();
    }
  );


/* =========================================================
   ELIMINAR RENGLÓN
========================================================= */

document
  .getElementById('empaqueContainer')
  .addEventListener(
    'click',
    event => {

      if (
        !event.target.classList.contains(
          'btn-del-row'
        )
      ) {
        return;
      }


      const container =
        document.getElementById(
          'empaqueContainer'
        );


      const filas =
        container.querySelectorAll(
          '.empaque-row'
        );


      const fila =
        event.target.closest(
          '.empaque-row'
        );


      if (filas.length > 1) {

        fila.remove();

      } else {

        fila
          .querySelectorAll('input')
          .forEach(input => {
            input.value = '';
          });
      }


      calcular();
    }
  );


/* =========================================================
   LIMPIAR
========================================================= */

document
  .getElementById('btnClear')
  .addEventListener(
    'click',
    () => {

      if (
        !confirm(
          '¿Reiniciar todos los campos para un nuevo lote?'
        )
      ) {
        return;
      }


      document.getElementById(
        'ritmoObjetivo'
      ).value = '20';


      document.getElementById(
        'pesoBin'
      ).value = '330';


      document.getElementById(
        'bines'
      ).value = '';


      document.getElementById(
        'totalLote'
      ).value = '';


      document.getElementById(
        'horaInicio'
      ).value = '';


      document.getElementById(
        'horaFin'
      ).value = '';


      document.getElementById(
        'pausas'
      ).value = '0';


      document.getElementById(
        'horaCierreTurno'
      ).value = '';


      document.getElementById(
        'desfasajeMin'
      ).value = '10';


      document.getElementById(
        'cajasIniciales'
      ).value = '';


      document.getElementById(
        'kgCajaInicial'
      ).value = '';


      document.getElementById(
        'ceraIni'
      ).value = '';


      document.getElementById(
        'ceraFin'
      ).value = '';


      document.getElementById(
        'jabonIni'
      ).value = '';


      document.getElementById(
        'jabonFin'
      ).value = '';


      /*
         Dejamos un solo renglón de empaque.
      */

      document.getElementById(
        'empaqueContainer'
      ).innerHTML = `
        <div class="empaque-row">

          <input
            type="number"
            class="e-cant"
            placeholder="Ej: 10"
            min="0"
            step="1"
            inputmode="numeric"
          >

          <input
            type="number"
            class="e-cajas"
            placeholder="Ej: 88"
            min="0"
            step="1"
            inputmode="numeric"
          >

          <input
            type="number"
            class="e-kg"
            placeholder="Ej: 15.0"
            min="0"
            step="0.1"
          >

          <button
            type="button"
            class="btn-del-row"
          >
            ×
          </button>

        </div>
      `;


      /*
         Volvemos a registrar los eventos.
      */

      document
        .querySelectorAll(
          '#empaqueContainer input'
        )
        .forEach(input => {

          input.addEventListener(
            'input',
            calcular
          );

          input.addEventListener(
            'change',
            calcular
          );

        });


      calcular();
    }
  );
