<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>El Paruco - Control de Volcado e Insumos</title>
  <style>
    :root {
      --bg: #f8fafc;
      --card: #ffffff;
      --orange: #f37324;
      --green-dark: #2d5738;
      --text: #1e293b;
      --muted: #64748b;
      --border: #e2e8f0;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    body {
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
      padding: 16px 12px 32px;
      min-height: 100vh;
    }
    .container {
      width: 100%;
      max-width: 440px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 20px 16px;
      box-shadow: 0 10px 25px -5px rgba(45, 87, 56, 0.08);
    }
    .brand-header {
      text-align: center;
      margin-bottom: 16px;
    }
    .brand-logo {
      width: 80px;
      height: 80px;
      object-fit: contain;
      border-radius: 50%;
      margin-bottom: 6px;
    }
    h1 {
      font-size: 1.2rem;
      font-weight: 700;
      color: var(--green-dark);
    }
    .subtitle {
      font-size: 0.75rem;
      color: var(--orange);
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    .section-title {
      font-size: 0.85rem;
      font-weight: 700;
      color: var(--green-dark);
      margin: 18px 0 10px;
      padding-bottom: 4px;
      border-bottom: 1.5px solid #edf2f7;
    }
    .form-group {
      margin-bottom: 12px;
    }
    .grid-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }
    .label-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 5px;
    }
    label {
      display: block;
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--green-dark);
    }
    .btn-update {
      background: none;
      border: none;
      color: var(--orange);
      font-size: 0.75rem;
      font-weight: 700;
      cursor: pointer;
      padding: 0;
    }
    input {
      width: 100%;
      padding: 9px 10px;
      background: #fdfdfd;
      border: 1.5px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      font-size: 0.95rem;
      outline: none;
    }
    input:focus {
      border-color: var(--orange);
    }
    .results {
      margin-top: 14px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }
    .res-card {
      background: #fafaf9;
      border-radius: 12px;
      padding: 10px 8px;
      border: 1px solid var(--border);
      text-align: center;
    }
    .res-card.highlight {
      background: #f0fdf4;
      border-color: #bbf7d0;
    }
    .res-title {
      font-size: 0.7rem;
      color: var(--muted);
      text-transform: uppercase;
      margin-bottom: 4px;
      font-weight: 700;
    }
    .res-value {
      font-size: 1.3rem;
      font-weight: 800;
      color: var(--green-dark);
    }
    .res-unit {
      font-size: 0.75rem;
      color: var(--muted);
      font-weight: 500;
    }
    .res-highlight {
      color: var(--orange);
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="brand-header">
      <img src="logo.jpg" alt="Logo El Paruco" class="brand-logo" onerror="this.style.display='none'">
      <h1>Control de Volcado e Insumos</h1>
      <div class="subtitle">El Paruco</div>
    </div>

    <!-- SECCIÓN 1: TIEMPOS Y RITMO -->
    <div class="section-title">⏱️ Ritmo de Volcado</div>
    
    <div class="grid-2 form-group">
      <div>
        <label for="bines">Bines volcados</label>
        <input type="number" id="bines" min="0" placeholder="Ej: 30" inputmode="numeric">
      </div>
      <div>
        <label for="pesoBin">Peso bin (kg)</label>
        <input type="number" id="pesoBin" value="330" inputmode="numeric">
      </div>
    </div>

    <div class="grid-2 form-group">
      <div>
        <label for="horaInicio">Hora inicial</label>
        <input type="time" id="horaInicio">
      </div>
      <div>
        <div class="label-row">
          <label for="horaFin">Hora final</label>
          <button type="button" class="btn-update" id="btnUpdate">↻ Actualizar</button>
        </div>
        <input type="time" id="horaFin">
      </div>
    </div>

    <div class="form-group">
      <label for="pausas">Pausas (minutos)</label>
      <input type="number" id="pausas" value="0" min="0" inputmode="numeric">
    </div>

    <div class="results">
      <div class="res-card highlight">
        <div class="res-title">Sin pausas (neto)</div>
        <div class="res-value res-highlight" id="ritmoNeto">0.0 <span class="res-unit">bin/h</span></div>
      </div>

      <div class="res-card">
        <div class="res-title">Con pausas (bruto)</div>
        <div class="res-value" id="ritmoBruto">0.0 <span class="res-unit">bin/h</span></div>
      </div>
    </div>

    <!-- SECCIÓN 2: INSUMOS QUÍMICOS (CERA Y JABÓN) -->
    <div class="section-title">🧪 Consumo de Cera y Jabón (L/t)</div>

    <div class="grid-2 form-group">
      <div>
        <label for="ceraIni">Cera Inicial (L)</label>
        <input type="number" step="0.1" id="ceraIni" placeholder="Ej: 50.0">
      </div>
      <div>
        <label for="ceraFin">Cera Final (L)</label>
        <input type="number" step="0.1" id="ceraFin" placeholder="Ej: 20.0">
      </div>
    </div>

    <div class="grid-2 form-group">
      <div>
        <label for="jabonIni">Jabón Inicial (L)</label>
        <input type="number" step="0.1" id="jabonIni" placeholder="Ej: 30.0">
      </div>
      <div>
        <label for="jabonFin">Jabón Final (L)</label>
        <input type="number" step="0.1" id="jabonFin" placeholder="Ej: 15.0">
      </div>
    </div>

    <div class="results">
      <div class="res-card">
        <div class="res-title">Consumo Cera</div>
        <div class="res-value" id="ceraTon">0.00 <span class="res-unit">L/t</span></div>
      </div>

      <div class="res-card">
        <div class="res-title">Consumo Jabón</div>
        <div class="res-value" id="jabonTon">0.00 <span class="res-unit">L/t</span></div>
      </div>
    </div>

  </div>

  <script>
    const inputs = [
      'bines', 'pesoBin', 'horaInicio', 'horaFin', 'pausas',
      'ceraIni', 'ceraFin', 'jabonIni', 'jabonFin'
    ];
    inputs.forEach(id => {
      document.getElementById(id).addEventListener('input', calcular);
      document.getElementById(id).addEventListener('change', calcular);
    });

    function setHoraActual() {
      const ahora = new Date();
      const horas = String(ahora.getHours()).padStart(2, '0');
      const minutos = String(ahora.getMinutes()).padStart(2, '0');
      document.getElementById('horaFin').value = `${horas}:${minutos}`;
      calcular();
    }

    setHoraActual();
    document.getElementById('btnUpdate').addEventListener('click', setHoraActual);

    function calcular() {
      const bines = parseFloat(document.getElementById('bines').value) || 0;
      const pesoBin = parseFloat(document.getElementById('pesoBin').value) || 330;
      const horaInicio = document.getElementById('horaInicio').value;
      const horaFin = document.getElementById('horaFin').value;
      const pausas = parseFloat(document.getElementById('pausas').value) || 0;

      const ceraIni = parseFloat(document.getElementById('ceraIni').value);
      const ceraFin = parseFloat(document.getElementById('ceraFin').value);
      const jabonIni = parseFloat(document.getElementById('jabonIni').value);
      const jabonFin = parseFloat(document.getElementById('jabonFin').value);

      // 1. CÁLCULO DE TONELADAS PROCESADAS
      const toneladas = (bines * pesoBin) / 1000;

      // 2. CÁLCULO DE RITMOS DE VOLCADO (IDÉNTICO AL PRIMER CÓDIGO)
      if (horaInicio && horaFin) {
        const [hIni, mIni] = horaInicio.split(':').map(Number);
        const [hFin, mFin] = horaFin.split(':').map(Number);

        const minInicio = hIni * 60 + mIni;
        let minFin = hFin * 60 + mFin;
        if (minFin < minInicio) minFin += 24 * 60;

        const tiempoBrutoMin = minFin - minInicio;
        const tiempoNetoMin = tiempoBrutoMin - pausas;

        if (tiempoBrutoMin > 0 && tiempoNetoMin > 0) {
          const horasBrutas = tiempoBrutoMin / 60;
          const horasNetas = tiempoNetoMin / 60;

          const ritmoConPausas = (bines / horasBrutas).toFixed(1);
          const ritmoSinPausas = (bines / horasNetas).toFixed(1);

          document.getElementById('ritmoNeto').innerHTML = `${ritmoSinPausas} <span class="res-unit">bin/h</span>`;
          document.getElementById('ritmoBruto').innerHTML = `${ritmoConPausas} <span class="res-unit">bin/h</span>`;
        } else {
          document.getElementById('ritmoNeto').innerHTML = `0.0 <span class="res-unit">bin/h</span>`;
          document.getElementById('ritmoBruto').innerHTML = `0.0 <span class="res-unit">bin/h</span>`;
        }
      } else {
        document.getElementById('ritmoNeto').innerHTML = `0.0 <span class="res-unit">bin/h</span>`;
        document.getElementById('ritmoBruto').innerHTML = `0.0 <span class="res-unit">bin/h</span>`;
      }

      // 3. CÁLCULO DE LITROS POR TONELADA (L/t)
      if (toneladas > 0) {
        if (!isNaN(ceraIni) && !isNaN(ceraFin) && ceraIni >= ceraFin) {
          const lCera = ceraIni - ceraFin;
          const lPorTonCera = (lCera / toneladas).toFixed(2);
          document.getElementById('ceraTon').innerHTML = `${lPorTonCera} <span class="res-unit">L/t</span>`;
        } else {
          document.getElementById('ceraTon').innerHTML = `0.00 <span class="res-unit">L/t</span>`;
        }

        if (!isNaN(jabonIni) && !isNaN(jabonFin) && jabonIni >= jabonFin) {
          const lJabon = jabonIni - jabonFin;
          const lPorTonJabon = (lJabon / toneladas).toFixed(2);
          document.getElementById('jabonTon').innerHTML = `${lPorTonJabon} <span class="res-unit">L/t</span>`;
        } else {
          document.getElementById('jabonTon').innerHTML = `0.00 <span class="res-unit">L/t</span>`;
        }
      } else {
        document.getElementById('ceraTon').innerHTML = `0.00 <span class="res-unit">L/t</span>`;
        document.getElementById('jabonTon').innerHTML = `0.00 <span class="res-unit">L/t</span>`;
      }
    }
  </script>
</body>
</html>
